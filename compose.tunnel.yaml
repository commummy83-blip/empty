services:
  cloudflared:
    image: cloudflare/cloudflared:2026.11.1
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?Ustaw token tunelu w pliku .env}
    depends_on:
      - gateway
  homepage:
    environment:
      HOMEPAGE_ALLOWED_HOSTS: "localhost:${LOCAL_PORT:-8080},127.0.0.1:${LOCAL_PORT:-8080},${PUBLIC_HOST:?Ustaw PUBLIC_HOST w pliku .env}"
